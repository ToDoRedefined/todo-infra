name: Terraform PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: validate
      target_environment: dev
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      skip_plan: false

  plan-dev:
    name: Plan dev
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: plan
      target_environment: dev
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      skip_plan: false
    secrets: inherit

  plan-test:
    name: Plan test
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: plan
      target_environment: test
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      skip_plan: false
    secrets: inherit

  plan-prod:
    name: Plan prod
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: plan
      target_environment: prod
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      skip_plan: false
    secrets: inherit

  eph-apply-destroy:
    name: Apply and destroy eph
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      command: apply-destroy
      target_environment: eph
      namespace: pr-${{ github.event.pull_request.number }}
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      skip_plan: false
    secrets: inherit
